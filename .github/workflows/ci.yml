name: ci
permissions:
  contents: read
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        # pyproject.toml lives here; running at the repo root finds no project
        # and fails with "Failed to spawn: pytest" (broken from 10-14 to PR0).
        working-directory: apps/api-py
    steps:
      - uses: actions/checkout@v4
      # schema.sql lives in the sibling repo; test_rls_policies reads it from ./cantrack-db.
      - uses: actions/checkout@v4
        with:
          repository: nik129linux/cantrack-db
          path: cantrack-db
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest -q ../../tests
      - run: uvx pip-audit
