[project]
name = "cantrack-api"
version = "0.1.0"
description = "CanTrack backend: FastAPI on top of Supabase (Postgres + Auth)."
requires-python = ">=3.12"
dependencies = [
    "cantrack-ai",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "pillow>=12.3.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../../tests/py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cantrack_api"]

[tool.uv.sources]
cantrack-ai = { git = "https://github.com/nik129linux/cantrack-ai.git" }
